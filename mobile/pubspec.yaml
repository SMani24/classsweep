name: classsweep
description: "On-device classroom attendance with a visual sweep and face verification."
publish_to: 'none'

version: 1.3.0+5

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  camera: ^0.12.2
  opencv_dart: ^2.2.2
  google_mlkit_face_detection: ^1.0.3
  google_mlkit_text_recognition: ^1.0.3
  sensors_plus: ^7.1.1
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  path_provider: ^2.1.6
  image: ^4.13.1
  camera_android: ^0.10.13
  crypto: ^3.0.8
  geolocator: ^14.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true
  assets:
    - assets/models/

# Native OpenCV symbols required by local scene, face, and motion processing.
hooks:
  user_defines:
    dartcv4:
      parallel_jobs: 3
      include_modules:
        - imgproc
        - imgcodecs
        - calib3d
        - features2d
        - flann
        - dnn
        - objdetect
        - video
