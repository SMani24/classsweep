[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "classsweep-server"
version = "0.1.0"
description = "Local enrollment review and phone-attested attendance server"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3", "python-multipart>=0.0.18,<1", "Pillow>=11,<13"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["classsweep*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
